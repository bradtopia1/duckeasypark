# carpi configuration
# ---------------------------------------------------------------------------
# Every value here has a sensible default, so you only need to set what you
# care about. Paths are resolved relative to this file.
# ---------------------------------------------------------------------------

# Which mode to run:
#   test            - frames from a video file (modes.test.video_path)
#   motion_capture  - frames from the live camera (modes.motion_capture)
# Both run the same pipeline, so everything below applies to either one.
mode: test

# --------------------------------------------------------------------------- #
# Motion detection - applies to every mode.
# --------------------------------------------------------------------------- #
motion:
  # 0.0 = least sensitive, 1.0 = most sensitive.
  # Higher values lower the background-subtraction threshold and shrink the
  # minimum blob size, so fainter / smaller movement is picked up.
  sensitivity: 0.5

  # Minimum blob size, as a percentage of the monitored area. Filters out
  # sensor noise and tiny flickers.
  min_area_percent: 0.4

  # Consecutive motion frames required before a clip starts recording.
  trigger_frames: 2

  # Region of interest, as percentages of the frame. Each axis accepts either:
  #   * a single number -> a centred band of that size   (e.g. 60)
  #   * [start, end]    -> an explicit span              (e.g. [15, 95])
  area:
    vertical: [10, 100]     # % of frame height, top -> bottom
    horizontal: [0, 100]    # % of frame width,  left -> right

  # Seconds of video kept before / after a motion event.
  clip:
    pre_seconds: 1.0
    post_seconds: 1.5

# --------------------------------------------------------------------------- #
# Per-stage resolution. Each stage runs at its own size; `null` means "keep the
# source resolution". They are separate because the stages want different things
# - this is the single biggest speed/memory knob.
# --------------------------------------------------------------------------- #
processing:
  # Motion detection only needs to be a coarse trigger, so it runs smallest.
  # Lower is much faster (roughly with the square of the reduction) and uses
  # less RAM; too low and small/distant movement gets missed. 640 is a good
  # starting point for a 1080p camera.
  motion_width: 640

  # Resolution the car detector sees. Larger keeps more pixels for small/distant
  # cars but costs speed; a real detector is not wired up yet, so this only
  # matters once you enable one. null = keep the source resolution.
  detect_width: 640

  # Resolution clips are written at. null = full source resolution, which is
  # what you want when the clips are training data (you can always downscale,
  # never upscale). Note the pre-roll buffer holds frames at THIS size, so
  # full-res clips use a lot more RAM - lower motion.clip.pre_seconds if needed.
  clip_width: null

  # Take the car crop from the ORIGINAL full-resolution frame (sharper crops
  # for the inspector model) instead of the detection frame.
  full_res_crops: true

# --------------------------------------------------------------------------- #
# Crops for a training set - shared by both modes, since the same frames yield
# the same crops. A cropped image of the moving region is written to
# output/crops/ for every motion event, named after the clip it came from, e.g.
# ..._event003_f00121_c0.jpg (frame 121 of event 3, blob 0). Those crops show
# whatever moved, not cars, so they are raw material for a training set rather
# than something to feed the inspector model as-is.
#
# Note for the rig: crops are never rotated or pruned, and one run (however many
# days it lasts) shares a single run stamp, so they pile up in one directory.
# --------------------------------------------------------------------------- #
crops:
  enabled: true

  # A crop is kept only when the region has moved on since the last one, so a
  # slow car gives a handful of distinct poses instead of one image per frame.
  min_gap_frames: 20      # never save two crops closer together than this.
                          # This is what sets the rate in practice: at 30 fps
                          # 20 frames is ~1.5 crops/second, so a car crossing
                          # in 7 seconds gives roughly 10 crops.
  iou_threshold: 0.85     # skip if the box still overlaps the last crop this much
  pad: 0.10               # grow the box by this fraction of its size

# --------------------------------------------------------------------------- #
# Runtime visibility. The rig runs headless, so the log is the only evidence of
# whether it is working, keeping up, or stuck.
# --------------------------------------------------------------------------- #
logging:
  # Seconds between "status:" lines while running. Each one reports frames
  # processed, current and average fps, pace against the source fps
  # ("keeping up" / "slower than real time"), the events so far, and the CPU
  # temperature where the machine exposes one. Set to 0 to disable. Needs -v
  # (info) to be visible.
  status_interval_seconds: 30

# --------------------------------------------------------------------------- #
# Provenance: when and where each clip and crop was recorded.
#
# Each filename carries a compact timestamp (YYYYMMDD_HHMMSS of the moment the
# event started), and the exact time and coordinates go into a sidecar index -
# one JSON object per line, one line per clip and per crop. Coordinates stay out
# of the filename on purpose: they are long, lose precision once rounded, and
# change the name whenever the rig moves.
#
# Both facts are placeholders for hardware that is not on the rig yet: the time
# is read from the machine clock (right only after NTP or a GPS fix on a Pi with
# no RTC), and the location source reports no fix until a GPS module is wired
# up. Adding one later means naming it in location.backend and nothing else.
# --------------------------------------------------------------------------- #
metadata:
  enabled: true

  # Where the sidecar index is written. Relative paths resolve against this
  # file; leave it out to default to <output_dir>/manifest.jsonl.
  # manifest_path: output/manifest.jsonl

  location:
    # placeholder - report one configured point (0, 0 unless set below), so the
    #               records are always populated without any GPS hardware
    # none        - report no fix (latitude/longitude come out null)
    backend: placeholder
    # options:                    # only used by the 'placeholder' backend
    #   latitude: 0.0
    #   longitude: 0.0

# --------------------------------------------------------------------------- #
# AI backends. Both default to `none`, so the app is motion-only: it records a
# clip for every motion event and stops. Nothing is detected and no model is
# loaded. Turn a stage on once you have a real model - or use the mocks to try
# the full path (they are fake by construction).
# --------------------------------------------------------------------------- #
detectors:
  car:
    backend: none                 # none | mock | opencv_dnn | yolo (last two: not wired up yet)
    # options:                    # only used by the mock backend
    #   confidence: 0.9
    #   expand: 0.15              # grow the motion box into a car-sized box

  inspector:
    backend: none                 # none | mock | tflite
    # Mock backend (positive_probability 1.0 flags EVERY car, 0.0 flags none):
    # options:
    #   positive_probability: 1.0
    #   seed: 1234
    # TFLite backend (your trained model):
    # options:
    #   model_path: models/inspector.tflite
    #   labels: [not_inspector, inspector]
    #   input_size: [224, 224]
    #   normalize: "0-1"            # "0-1" | "-1-1" | "none"

# Where clips, cropped cars and flagged inspectors are written.
output_dir: output

# --------------------------------------------------------------------------- #
# Per-mode settings.
# --------------------------------------------------------------------------- #
modes:
  test:
    # Your video file, used instead of a live camera (relative to this file).
    # Point this at your own recording. No video yet? Generate a synthetic clip
    # for testing with: python scripts/make_sample_video.py
    video_path: samples/clip_004.mp4
    loop: false                   # restart from the start when the file ends
    realtime: false               # sleep to play back at the file's native FPS
    show_preview: false           # needs a GUI build of OpenCV (see README.md)
    max_seconds: null             # stop after N seconds of source (null = no cap)

  motion_capture:
    # Live camera instead of a file. It records a clip for every motion event
    # and runs until you stop it (Ctrl-C, or systemd) - this is the mode to put
    # in the autostart unit on the rig. Sensitivity, area, clip length and the
    # AI backends all come from the shared sections above, so tune them here in
    # test mode and the camera behaves the same.

    # Camera number, or a device path (e.g. /dev/video2). For the picamera2
    # backend this is the camera index the Pi's libcamera knows.
    device: 0

    # auto      - picamera2 when installed (on a Pi), OpenCV anywhere else
    # opencv    - USB / V4L2 camera (e.g. force this on a Pi using a webcam)
    # picamera2 - the Pi's CSI camera ribbon cable
    backend: auto

    # Ask the camera for this size. Set BOTH or NEITHER (neither = whatever the
    # camera provides). The size actually granted is logged at startup.
    # 2560x1440 is this camera's highest 30 fps mode (it advertises more, but
    # only as stills). If the pace drops below 1.0x, 1920x1080 is the lighter
    # full-HD step down. A size the camera cannot do at 30 fps in MJPEG comes
    # back lower than asked - watch the startup line.
    width: 2560
    height: 1440

    fps: 30.0                     # requested capture frame rate
    show_preview: false           # needs a GUI build of OpenCV (see README.md)
